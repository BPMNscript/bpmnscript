name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check for uncommitted generated files
        run: git diff --exit-code

      # The end-to-end suite builds the Spring Boot image and boots Operaton
      # through testcontainers; the runner ships Docker.
      - run: npm test
        if: success() || failure()

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      # Cross-workspace imports resolve through each package's declarations.
      - run: npm run build

      - name: Typecheck test sources
        run: npm run typecheck --workspaces --if-present

      - run: npm run lint
      - run: npm run format:check
